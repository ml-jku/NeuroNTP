# pyproject.toml
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro_ntp"
version = "1.1.0"
description = "NeuroNTP - multimodal self-supervised model for seizure detection and prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jozsef Kovacs" }, { name = "Philipp Seidl" }]
license = { text = "MIT" }

dependencies = [
  # numerical / data
  "numpy>=2.0",
  "scipy>=1.12",
  "pandas>=2.2",
  "tables>=3.9",              # pandas HDFStore (core datasets and dataset views)
  "h5py>=3.10",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "tqdm>=4.66",
  "tqdm-joblib>=0.0.5",

  # biosignal I/O
  "mne>=1.6",
  "pyedflib>=0.1.42",

  # configuration
  "pyyaml>=6.0",
  "omegaconf>=2.3",
  "dacite>=1.8",

  # deep learning and training
  # torch: install the CUDA build matching the system first (see README); pip then keeps the installed build
  "torch>=2.4",
  "pytorch-lightning>=2.4,<2.5",
  "transformers>=5.0",
  "linear-attention-transformer>=0.19",
  "xlstm>=2.0",
  "wandb>=0.17",

  # evaluation and plotting
  "timescoring>=0.0.6",
  "matplotlib>=3.8",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# CUDA Mamba backbone; requires a CUDA toolkit and compiler to build
mamba = [
  "mamba-ssm>=2.3",
]

# plotting and figures
viz = [
  "seaborn>=0.13",
  "statannot>=0.2.3",
  "tueplots>=0.0.17",
]

# notebooks
notebook = [
  "jupyterlab>=4.0",
  "ipykernel>=6.29",
]

dev = ["pytest>=8", "black>=24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuro_ntp = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]
